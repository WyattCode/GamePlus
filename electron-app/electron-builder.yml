appId: com.gameplus.app
productName: Game+
# Personal-use build: never publish/upload artifacts from a build.
publish: null
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# The self-contained C# backend (gameplus-host.exe + native cores) ships unpacked under
# resources/backend — matching the prod path in src/main/sidecar.ts.
extraResources:
  - from: resources/backend
    to: backend
    filter:
      - '**/*'
  # Ship the licence and third-party notices with the app (resources root).
  - from: ../LICENSE
    to: LICENSE
  - from: ../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
win:
  icon: build/icon.ico
  target:
    - dir
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Signing is optional and never required: without CSC_LINK the installer is simply unsigned and
  # Windows SmartScreen will warn on first run. Code signing is wired via the standard
  # electron-builder env vars so no certificate path is baked in:
  #   set CSC_LINK=<path to .pfx or base64 of the cert> and CSC_KEY_PASSWORD=<pw> before `npm run dist`.
  #   When both are set, electron-builder signs Game+.exe, the backend exe/dll and the NSIS installer.
  #   Leave unset to skip signing (installer will trigger a SmartScreen "unknown publisher" warning).
  forceCodeSigning: false
nsis:
  # Per-machine install into Program Files: the app registers a highest-privileges logon scheduled
  # task (\Game+\AutoStart) that runs Game+.exe. A per-user install would live in a user-writable
  # folder, so any user-level process could replace the exe and gain admin at next logon. Installing
  # under Program Files (admin-only writable) is what makes the autostart task safe.
  oneClick: false
  perMachine: true
  allowElevation: true
  # Choosing a folder outside Program Files still works, but disables 开机启动 (the backend refuses
  # to create the autostart task for a user-writable exe path).
  allowToChangeInstallationDirectory: true
  # Custom NSIS hooks: detect/clean up an older per-user install and its stale autostart task.
  include: build/installer.nsh
  shortcutName: Game+
  # Show the GPL-3.0 licence in the installer.
  license: ../LICENSE
compression: normal
